name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**','public/**','electron/**','package.json','vite.config.js','index.html','.github/workflows/windows.yml']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: BlockX-Windows
          path: release/*.exe
