name: BlockX Windows Portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'electron/**'
      - 'package.json'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/windows.yml'
concurrency:
  group: blockx-windows
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web game
        run: npm run build
      - name: Package one portable EXE
        run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload BlockX EXE
        uses: actions/upload-artifact@v4
        with:
          name: BlockX-Portable-EXE
          path: release/*.exe
          if-no-files-found: error
